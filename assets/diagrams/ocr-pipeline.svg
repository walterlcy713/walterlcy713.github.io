<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="oarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="oarrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="900" height="460" rx="12" fill="#0f172a"/>
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">OCR blackjack monitoring — cards to game state</text>

  <!-- main flow -->
  <rect x="40" y="90" width="130" height="64" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="118" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Table camera</text>
  <text x="105" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">Card images</text>

  <line x1="170" y1="122" x2="225" y2="122" stroke="#38bdf8" stroke-width="2" marker-end="url(#oarrow)"/>

  <rect x="230" y="90" width="160" height="64" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="310" y="118" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">OCR engine</text>
  <text x="310" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">colleague’s model</text>

  <line x1="390" y1="122" x2="445" y2="122" stroke="#38bdf8" stroke-width="2" marker-end="url(#oarrow)"/>
  <text x="418" y="112" text-anchor="middle" fill="#64748b" font-size="10">Card data</text>

  <rect x="450" y="74" width="210" height="112" rx="10" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="555" y="100" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Monitor service (Go)</text>
  <text x="555" y="118" text-anchor="middle" fill="#99f6e4" font-size="11">Round boundaries</text>
  <text x="555" y="134" text-anchor="middle" fill="#99f6e4" font-size="11">Player counts · hand totals</text>
  <text x="555" y="150" text-anchor="middle" fill="#99f6e4" font-size="11">Game results</text>

  <text x="555" y="166" text-anchor="middle" fill="#99f6e4" font-size="11">Reconnect · resume round</text>

  <!-- outputs -->
  <line x1="660" y1="100" x2="725" y2="84" stroke="#38bdf8" stroke-width="2" marker-end="url(#oarrow)"/>
  <line x1="660" y1="122" x2="725" y2="152" stroke="#38bdf8" stroke-width="2" marker-end="url(#oarrow)"/>
  <line x1="660" y1="144" x2="725" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#oarrow)"/>

  <rect x="730" y="60" width="140" height="48" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="800" y="80" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Live board</text>
  <text x="800" y="96" text-anchor="middle" fill="#94a3b8" font-size="11">React · real time</text>

  <rect x="730" y="128" width="140" height="48" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="800" y="148" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">History + CSV</text>
  <text x="800" y="164" text-anchor="middle" fill="#94a3b8" font-size="9">Search · filter · export</text>

  <rect x="730" y="196" width="140" height="48" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="800" y="216" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Game replay</text>
  <text x="800" y="232" text-anchor="middle" fill="#94a3b8" font-size="11">Card-update records</text>

  <!-- calibration tool -->
  <rect x="230" y="310" width="230" height="80" rx="10" fill="#312e81" stroke="#a78bfa"/>
  <text x="345" y="336" text-anchor="middle" fill="#e0e7ff" font-size="14" font-weight="700">Camera settings (Godot)</text>
  <text x="345" y="354" text-anchor="middle" fill="#c7d2fe" font-size="11">adjust detection regions</text>
  <text x="345" y="370" text-anchor="middle" fill="#c7d2fe" font-size="11">request OCR restart</text>

  <line x1="405" y1="310" x2="525" y2="194" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#oarrow2)"/>
  <text x="590" y="275" text-anchor="middle" fill="#8b83c9" font-size="11">settings · restart request</text>

  <text x="450" y="416" text-anchor="middle" fill="#94a3b8" font-size="11">Persistent JSON game records · internal automated and manual testing</text>
  <text x="450" y="438" text-anchor="middle" fill="#64748b" font-size="12">Internal-test tools: Go monitoring · React current state / history · Godot camera settings</text>
</svg>
